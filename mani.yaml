specs:
  parallel:
    output: table
    parallel: true
    ignore_errors: true

  parallel-strict:
    output: table
    parallel: true
    ignore_errors: false

tasks:
  sync-all:
    desc: Sync ALL repos in parallel (fetch + ff-only pull on current branch)
    spec: parallel
    cmd: |
      git fetch --all --prune --tags
      git pull --ff-only

  sync-all-default:
    desc: Switch every repo to its default branch (origin/HEAD), then fetch + ff-only pull, in parallel
    spec: parallel
    cmd: |
      set -e
      git fetch --all --prune --tags
      default=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@')
      if [ -z "$default" ]; then
        echo "no origin/HEAD set — skipping"
        exit 0
      fi
      current=$(git rev-parse --abbrev-ref HEAD)
      if [ "$current" != "$default" ]; then
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "working tree dirty on $current — refusing to switch to $default"
          exit 1
        fi
        git checkout "$default"
      fi
      git pull --ff-only

  status:
    desc: Short working-tree status with upstream tracking info
    cmd: git status -sb

  branch:
    desc: Show current branch name
    cmd: git rev-parse --abbrev-ref HEAD

  default-branch:
    desc: Show the upstream default branch (origin/HEAD)
    cmd: git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@' || echo "(no origin/HEAD)"

  fetch:
    desc: Fetch from origin and prune deleted remote branches
    cmd: git fetch --all --prune --tags

  pull:
    desc: Fast-forward pull from origin on the current branch
    cmd: git pull --ff-only

  sync:
    desc: Fetch + fast-forward pull on the current branch
    cmd: |
      git fetch --all --prune --tags
      git pull --ff-only

  sync-default:
    desc: Switch to the default branch (origin/HEAD), then fetch + fast-forward pull
    cmd: |
      set -e
      git fetch --all --prune --tags
      default=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@')
      if [ -z "$default" ]; then
        echo "no origin/HEAD set — skipping"
        exit 0
      fi
      current=$(git rev-parse --abbrev-ref HEAD)
      if [ "$current" != "$default" ]; then
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "working tree dirty on $current — refusing to switch to $default"
          exit 1
        fi
        git checkout "$default"
      fi
      git pull --ff-only

  dirty:
    desc: Exit non-zero if working tree has uncommitted changes (use with --output table to scan)
    cmd: |
      if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
        echo clean
      else
        echo DIRTY
        exit 1
      fi

  ahead-behind:
    desc: Show how many commits the current branch is ahead/behind its upstream
    cmd: |
      upstream=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)
      if [ -z "$upstream" ]; then
        echo "(no upstream)"
        exit 0
      fi
      ahead=$(git rev-list --count "$upstream"..HEAD)
      behind=$(git rev-list --count HEAD.."$upstream")
      printf "ahead %s, behind %s (vs %s)\n" "$ahead" "$behind" "$upstream"

  log-recent:
    desc: Last 10 commits, oneline
    cmd: git log --oneline -10

  remote:
    desc: Show configured remotes
    cmd: git remote -v

  install-hooks:
    desc: Point this repo's git hooks at the shared workspace .githooks (DCO sign-off)
    cmd: |
      root=$(cd "$(git rev-parse --show-toplevel)/../.." && pwd)
      git config core.hooksPath "$root/.githooks"
      echo "core.hooksPath -> $root/.githooks"

  wt-add:
    desc: "Create a worktree for a branch as a sibling of main (BRANCH=<name> [BASE=main])"
    cmd: |
      : "${BRANCH:?set BRANCH=<branch-name>}"
      base="${BASE:-main}"
      project=$(basename "$(dirname "$PWD")")
      dir="$BRANCH"
      # Projects tagged 'flat-worktree' reach outside themselves by relative
      # path, so every checkout must stay at the same depth as main/ — the
      # branch name is flattened into a single directory level.
      if mani list projects -t flat-worktree --headers project --color=false 2>/dev/null \
         | grep -qE "^[[:space:]]*${project}[[:space:]]*$"; then
        dir=$(printf '%s' "$BRANCH" | tr '/' '-')
        if [ "$dir" != "$BRANCH" ]; then
          echo "note: '$project' is flat-worktree — using directory '$dir' (not '$BRANCH')"
          echo "      see docs/working-with-mani-and-worktrees.md — 'Exemptions'"
        fi
      fi
      if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
        git worktree add "../$dir" "$BRANCH"
      else
        git worktree add -b "$BRANCH" "../$dir" "$base"
      fi
      echo "worktree: $(cd "../$dir" && pwd)  (branch $BRANCH)"
