projects:
  # --- Vidocq organisation -------------------------------------------------
  vidocq:
    path: vidocq/main
    url: git@codefloe.com:Vidocq/vidocq.git
    desc: The Vidocq monorepo (parent POM, components, preview, incubator, runtime)
    tags: [vidocq, code]

  vidocq-docs:
    path: vidocq-docs/main
    url: git@codefloe.com:Vidocq/vidocq-docs.git
    desc: Antora documentation site (English-only, vidocq-docs ADR 0004)
    # flat-worktree: antora-playbook-local.yml reaches sibling repos by relative
    # path (../../<repo>/main), so every checkout must sit exactly one level
    # under vidocq-docs/ — worktree dirs are flattened (fix/foo -> fix-foo).
    # See docs/working-with-mani-and-worktrees.md, section "Exemptions".
    tags: [vidocq, docs, flat-worktree]

  pages:
    path: pages/main
    url: git@codefloe.com:Vidocq/pages.git
    desc: vidocq.dev site (Roq, deployed to Cloudflare Pages)
    tags: [vidocq, docs, pages]

  governance:
    path: governance/main
    url: git@codefloe.com:Vidocq/governance.git
    desc: Contribution rules, CLA, contributor GPG keys (read by governance-checks)
    tags: [vidocq, governance]

  vidocq-benchmarks:
    path: vidocq-benchmarks/main
    url: git@codefloe.com:Vidocq/vidocq-benchmarks.git
    desc: Benchmark applications and load scripts (Vidocq vs other runtimes)
    tags: [vidocq, code, bench]

  vidocq-tutorial:
    path: vidocq-tutorial/main
    url: git@codefloe.com:Vidocq/vidocq-tutorial.git
    desc: Step-by-step Vidocq tutorial (private for now)
    tags: [vidocq, docs]

  # --- CI ------------------------------------------------------------------
  ci:
    path: ci/main
    url: git@codefloe.com:Vidocq/ci.git
    desc: Shared composite actions and reusable workflows (setup-maven, sonar-analysis, merge-bot, ...)
    tags: [ci]

  # dep-graph and GestionProjet serve the multi-repo CI of erasmus, tassis and
  # verne only; archive them once those three have moved (incubator/ or VCU).
  dep-graph:
    path: dep-graph/main
    url: git@codefloe.com:Vidocq/dep-graph.git
    desc: Cross-repository dependency graph (erasmus, tassis, verne)
    tags: [ci, legacy]

  GestionProjet:
    path: GestionProjet/main
    url: git@codefloe.com:Vidocq/GestionProjet.git
    desc: Multi-repo workflow templates (erasmus, tassis, verne)
    tags: [ci, legacy]

  # --- Repositories not in the monorepo yet ----------------------------------
  # erasmus and tassis go into the monorepo's incubator/, verne goes to VCU.
  erasmus:
    path: erasmus/main
    url: git@codefloe.com:Vidocq/erasmus.git
    desc: Bean Validation implementation (to incubator/)
    tags: [code, legacy]

  tassis:
    path: tassis/main
    url: git@codefloe.com:Vidocq/tassis.git
    desc: Messaging implementation (to incubator/)
    tags: [code, legacy]

  verne:
    path: verne/main
    url: git@codefloe.com:Vidocq/verne.git
    desc: Template engine (to VCU)
    tags: [code, legacy]

  # --- VidocqCodeUniverse (VCU) ----------------------------------------------
  vcu-template:
    path: vcu-template/main
    url: git@codefloe.com:VidocqCodeUniverse_VCU/template.git
    desc: Template of a VCU extension
    tags: [vcu]

  vidocq_vcu_extension_lc4jcdi:
    path: vidocq_vcu_extension_lc4jcdi/main
    url: git@codefloe.com:VidocqCodeUniverse_VCU/vidocq_vcu_extension_lc4jcdi.git
    desc: langchain4j-cdi MCP extension
    tags: [vcu, code]

  vidocq_vcu_extension_vaadin:
    path: vidocq_vcu_extension_vaadin/main
    url: git@codefloe.com:VidocqCodeUniverse_VCU/vidocq_vcu_extension_vaadin.git
    desc: Vaadin Flow extension and its dev console panel
    tags: [vcu, code]

  vaadin-on-vidocq:
    path: vaadin-on-vidocq/main
    url: git@codefloe.com:VidocqCodeUniverse_VCU/vaadin-on-vidocq.git
    desc: A Vaadin Flow application on the Vidocq runtime (end-to-end replay target)
    tags: [vcu, code]

specs:
  parallel:
    output: table
    parallel: true
    ignore_errors: true

  parallel-strict:
    output: table
    parallel: true
    ignore_errors: false

tasks:
  sync-all:
    desc: Sync ALL repos in parallel (fetch + ff-only pull on current branch)
    spec: parallel
    cmd: |
      git fetch --all --prune --tags
      git pull --ff-only

  sync-all-default:
    desc: Switch every repo to its default branch (origin/HEAD), then fetch + ff-only pull, in parallel
    spec: parallel
    cmd: |
      set -e
      git fetch --all --prune --tags
      default=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@')
      if [ -z "$default" ]; then
        echo "no origin/HEAD set — skipping"
        exit 0
      fi
      current=$(git rev-parse --abbrev-ref HEAD)
      if [ "$current" != "$default" ]; then
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "working tree dirty on $current — refusing to switch to $default"
          exit 1
        fi
        git checkout "$default"
      fi
      git pull --ff-only

  status:
    desc: Short working-tree status with upstream tracking info
    cmd: git status -sb

  branch:
    desc: Show current branch name
    cmd: git rev-parse --abbrev-ref HEAD

  default-branch:
    desc: Show the upstream default branch (origin/HEAD)
    cmd: git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@' || echo "(no origin/HEAD)"

  fetch:
    desc: Fetch from origin and prune deleted remote branches
    cmd: git fetch --all --prune --tags

  pull:
    desc: Fast-forward pull from origin on the current branch
    cmd: git pull --ff-only

  sync:
    desc: Fetch + fast-forward pull on the current branch
    cmd: |
      git fetch --all --prune --tags
      git pull --ff-only

  sync-default:
    desc: Switch to the default branch (origin/HEAD), then fetch + fast-forward pull
    cmd: |
      set -e
      git fetch --all --prune --tags
      default=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null | sed 's@^origin/@@')
      if [ -z "$default" ]; then
        echo "no origin/HEAD set — skipping"
        exit 0
      fi
      current=$(git rev-parse --abbrev-ref HEAD)
      if [ "$current" != "$default" ]; then
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "working tree dirty on $current — refusing to switch to $default"
          exit 1
        fi
        git checkout "$default"
      fi
      git pull --ff-only

  dirty:
    desc: Exit non-zero if working tree has uncommitted changes (use with --output table to scan)
    cmd: |
      if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
        echo clean
      else
        echo DIRTY
        exit 1
      fi

  ahead-behind:
    desc: Show how many commits the current branch is ahead/behind its upstream
    cmd: |
      upstream=$(git rev-parse --abbrev-ref --symbolic-full-name '@{u}' 2>/dev/null || true)
      if [ -z "$upstream" ]; then
        echo "(no upstream)"
        exit 0
      fi
      ahead=$(git rev-list --count "$upstream"..HEAD)
      behind=$(git rev-list --count HEAD.."$upstream")
      printf "ahead %s, behind %s (vs %s)\n" "$ahead" "$behind" "$upstream"

  log-recent:
    desc: Last 10 commits, oneline
    cmd: git log --oneline -10

  remote:
    desc: Show configured remotes
    cmd: git remote -v

  install-hooks:
    desc: Point this repo's git hooks at the shared workspace .githooks (DCO sign-off)
    cmd: |
      root=$(cd "$(git rev-parse --show-toplevel)/../.." && pwd)
      git config core.hooksPath "$root/.githooks"
      echo "core.hooksPath -> $root/.githooks"

  wt-add:
    desc: "Create a worktree for a branch as a sibling of main (BRANCH=<name> [BASE=main])"
    cmd: |
      : "${BRANCH:?set BRANCH=<branch-name>}"
      base="${BASE:-main}"
      project=$(basename "$(dirname "$PWD")")
      dir="$BRANCH"
      # Projects tagged 'flat-worktree' reach outside themselves by relative
      # path, so every checkout must stay at the same depth as main/ — the
      # branch name is flattened into a single directory level.
      if mani list projects -t flat-worktree --headers project --color=false 2>/dev/null \
         | grep -qE "^[[:space:]]*${project}[[:space:]]*$"; then
        dir=$(printf '%s' "$BRANCH" | tr '/' '-')
        if [ "$dir" != "$BRANCH" ]; then
          echo "note: '$project' is flat-worktree — using directory '$dir' (not '$BRANCH')"
          echo "      see docs/working-with-mani-and-worktrees.md — 'Exemptions'"
        fi
      fi
      if git show-ref --verify --quiet "refs/heads/$BRANCH"; then
        git worktree add "../$dir" "$BRANCH"
      else
        git worktree add -b "$BRANCH" "../$dir" "$base"
      fi
      echo "worktree: $(cd "../$dir" && pwd)  (branch $BRANCH)"
